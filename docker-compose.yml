version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Relational Database (Authoritative Datastore)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-library_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Elasticsearch Full-Text & Fuzzy Search Engine
  # -------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: library-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # -------------------------------------------------------------
  # 3. Django REST Framework Backend API (Gunicorn WSGI)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-library_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=library_books
      - ELASTICSEARCH_TIMEOUT=3
      - SEED_ON_STARTUP=true
      - INDEX_ON_STARTUP=true
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - library_network
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # -------------------------------------------------------------
  # 4. React 18 / Vite Frontend (Nginx SPA Container)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: library-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # 5. Nginx Reverse Proxy API Gateway
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: library-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    networks:
      - library_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

# -------------------------------------------------------------
# Networks & Persistent Named Volumes
# -------------------------------------------------------------
networks:
  library_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  es_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
